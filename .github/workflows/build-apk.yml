name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The 'tools' package was removed from the SDK repository; asking for it
          # makes sdkmanager fail with "Failed to find package 'tools'" (exit 1).
          packages: 'platform-tools'

      - name: Signing key (only when the repo has none)
        working-directory: base
        run: |
          if [ -f keystore/keystore.properties ]; then
            echo "Using the keystore committed in the repo: each build installs over the last."
          else
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/release.jks -alias spoon \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass spoon2026 -keypass spoon2026 \
              -dname "CN=Spoon Modified Build, O=Prashant, C=IN"
            printf 'storeFile=release.jks\nstorePassword=spoon2026\nkeyAlias=spoon\nkeyPassword=spoon2026\n' > keystore/keystore.properties
          fi

      - name: Build the release APK
        working-directory: base
        env:
          # --no-daemon runs the build in the launcher JVM, so the heap comes from
          # GRADLE_OPTS. The Kotlin compiler crashed on the default heap.
          GRADLE_OPTS: '-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PappVersionName=1.0.19 \
            -PappVersionCode=219 \
            -Pabis=arm64-v8a,armeabi-v7a \
            -PupdateRepo=prakha194/Spoon \
            --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: spoon-apk
          path: base/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
