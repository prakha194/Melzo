name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The 'tools' package was removed from the SDK repository; asking for it
          # makes sdkmanager fail with "Failed to find package 'tools'" (exit 1).
          packages: 'platform-tools'

      - name: Generate a signing key for this build
        working-directory: base
        run: |
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/release.jks -alias orpheon \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass orpheon2026 -keypass orpheon2026 \
            -dname "CN=Orpheon Modified Build, O=Prakha, C=IN"
          printf 'storeFile=release.jks\nstorePassword=orpheon2026\nkeyAlias=orpheon\nkeyPassword=orpheon2026\n' > keystore/keystore.properties

      - name: Build the release APK
        working-directory: base
        env:
          # --no-daemon runs the build in the launcher JVM, so the heap comes from
          # GRADLE_OPTS. The Kotlin compiler crashed on the default heap.
          GRADLE_OPTS: '-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PappVersionName=1.0.1 \
            -PappVersionCode=201 \
            -Pabis=arm64-v8a,armeabi-v7a \
            --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: orpheon-apk
          path: base/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
